services:
  app:
    build: .
    image: al_cutout_app
    container_name: al_cutout_app
    # 端口只 expose 不 publish，外网走 nginx
    expose:
      - "5000"
    volumes:
      - ./models:/app/models:ro           # 模型 176MB 只读挂载，不进镜像
      - app_uploads:/app/uploads          # 上传目录持久化
      - app_outputs:/app/static/outputs  # 输出目录持久化
    environment:
      - PROD=1
      - HOST=0.0.0.0
      - PORT=5000
      - THREADS=4
      - MAX_UPLOAD_MB=5
      - FLASK_DEBUG=
      # nginx 同源反代时，浏览器看到的是 nginx 域名 → 不需要 CORS 限定
      # 若前后端分离部署（前端单独域名），需在 app.py 加 ALLOWED_ORIGINS 环境变量支持
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: al_cutout_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - app_outputs:/usr/share/nginx/html/static/outputs:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_uploads:
  app_outputs:
