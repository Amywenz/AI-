worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 上传大小限制：5MB 内容 + multipart 头 → 设 10M 留余量
    # 与 app.py 的 MAX_UPLOAD_MB 协同：client_max_body_size 应 >= MAX_UPLOAD_MB + 1M
    client_max_body_size 10m;

    # 大图生成可能 5~10s，给后端充足时间
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    upstream al_cutout_app {
        server app:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 静态输出文件由 nginx 直接 serve，不走 Flask（更快、更省 CPU）
        location /static/outputs/ {
            alias /usr/share/nginx/html/static/outputs/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # 其他请求（/ 和 /api/process）反代到 app
        location / {
            proxy_pass http://al_cutout_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # TODO 套 SSL 时取消注释（需挂载证书 + listen 443 ssl）
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
    }
}
