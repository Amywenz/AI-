<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 证件照生成器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --error-color: #e63946;
            --success-color: #2a9d8f;
        }

        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border: none;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-weight: 600;
            padding: 1.25rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 12px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .color-option:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .color-option.active {
            transform: scale(1.1);
            border-color: var(--dark-color);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #preview-container {
            position: relative;
            min-height: 300px;
            background-color: #e9ecef;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s;
        }

        #preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 8px;
        }

        #upload-prompt {
            text-align: center;
            color: #6c757d;
            padding: 2rem;
        }

        #result-container {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        #result-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #dee2e6;
        }

        .upload-area {
            border: 2px dashed #adb5bd;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: rgba(255, 255, 255, 0.5);
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.05);
            transform: translateY(-3px);
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.1);
        }

        .spinner-container {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 0.25em;
        }

        .alert-message {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            min-width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--success-color), #1a936f);
            border: none;
            color: white;
            font-weight: 500;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #1a936f, #137a63);
            color: white;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .size-controls {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(72, 149, 239, 0.25);
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- 通知消息 -->
    <div id="alertMessage" class="alert alert-dismissible fade show alert-message" role="alert">
        <span id="alertText"></span>
        <button type="button" class="btn-close" onclick="hideAlert()"></button>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card mb-4">
                    <div class="card-header text-center py-3">
                        <h2 class="mb-0"><i class="bi bi-camera me-2"></i>AI 智能证件照生成器</h2>
                    </div>
                    <div class="card-body">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label for="imageUpload" class="form-label fw-bold">1. 上传照片</label>
                                    <div id="uploadArea" class="upload-area">
                                        <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
                                        <h5 class="mt-3 mb-2">拖放文件到此处</h5>
                                        <p class="small text-muted">或点击选择文件</p>
                                        <p class="small text-muted">支持 JPG, PNG 格式，最大 5MB</p>
                                        <input type="file" id="imageUpload" class="d-none" accept="image/*">
                                    </div>
                                </div>

                                <div id="preview-container" class="mb-4">
                                    <img id="preview-image" alt="预览图">
                                    <div id="upload-prompt">
                                        <i class="bi bi-image fs-1 text-muted"></i>
                                        <p class="mt-2 mb-0">图片预览将显示在这里</p>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-4">
                                    <label class="form-label fw-bold">2. 背景设置</label>
                                    <div class="d-flex align-items-center mb-3">
                                        <span class="me-3">预设颜色:</span>
                                        <div class="color-option active" style="background-color: #FFFFFF;" data-color="#FFFFFF" title="白色"></div>
                                        <div class="color-option" style="background-color: #438EDB;" data-color="#438EDB" title="蓝色"></div>
                                        <div class="color-option" style="background-color: #FF0000;" data-color="#FF0000" title="红色"></div>
                                        <div class="color-option" style="background-color: #00FF00;" data-color="#00FF00" title="绿色"></div>
                                        <div class="color-option" style="background-color: #000000;" data-color="#000000" title="黑色"></div>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <span class="me-3">自定义:</span>
                                        <input type="color" id="customColor" class="form-control form-control-color" value="#FFFFFF" title="选择自定义颜色">
                                        <span id="colorHex" class="ms-2 fw-bold">#FFFFFF</span>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold">3. 尺寸设置</label>
                                    <div class="form-check form-switch mb-3">
                                        <input class="form-check-input" type="checkbox" id="keepSize" checked>
                                        <label class="form-check-label" for="keepSize">保持原图尺寸</label>
                                    </div>

                                    <div id="sizeControls" class="size-controls" style="display: none;">
                                        <div class="row g-3">
                                            <div class="col-md-6">
                                                <label for="width" class="form-label">宽度 (像素)</label>
                                                <input type="number" class="form-control" id="width" value="295" min="100">
                                            </div>
                                            <div class="col-md-6">
                                                <label for="height" class="form-label">高度 (像素)</label>
                                                <input type="number" class="form-control" id="height" value="413" min="100">
                                            </div>
                                        </div>
                                        <div class="mt-2 text-muted small">
                                            常用尺寸: 一寸(295×413) | 二寸(413×626)
                                        </div>
                                    </div>
                                </div>

                                <div class="d-grid">
                                    <button id="processBtn" class="btn btn-primary btn-lg py-3" disabled>
                                        <i class="bi bi-magic me-2"></i> 生成证件照
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 加载指示器 -->
                <div id="loadingSpinner" class="text-center my-5" style="display: none;">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">处理中...</span>
                    </div>
                    <h5 class="mt-3">正在处理您的照片...</h5>
                    <p class="text-muted">这可能需要几秒钟时间</p>
                    <div class="progress mt-3" style="height: 8px;">
                        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                </div>

                <!-- 结果容器 -->
                <div id="result-container" class="card">
                    <div class="card-header text-center py-3">
                        <h3 class="mb-0"><i class="bi bi-check-circle-fill me-2 text-success"></i>处理完成</h3>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <img id="result-image" class="img-fluid shadow" alt="生成结果">
                        </div>
                        <div class="d-flex justify-content-center gap-3">
                            <a id="downloadBtn" class="btn btn-download btn-lg px-4">
                                <i class="bi bi-download me-2"></i> 下载证件照
                            </a>
                            <button id="resetBtn" class="btn btn-outline-primary btn-lg px-4">
                                <i class="bi bi-arrow-repeat me-2"></i> 重新开始
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light py-4 mt-5">
        <div class="container text-center text-muted">
            <p class="mb-0">© 2023 AI 证件照生成器 | 使用人工智能技术自动去除背景</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 显示通知消息
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alertMessage');
            const alertText = document.getElementById('alertText');

            alert.className = `alert alert-dismissible fade show alert-message alert-${type}`;
            alertText.textContent = message;
            alert.style.display = 'block';

            // 5秒后自动隐藏
            setTimeout(hideAlert, 5000);
        }

        // 隐藏通知消息
        function hideAlert() {
            document.getElementById('alertMessage').style.display = 'none';
        }

        // 模拟进度条
        function simulateProgress() {
            const progressBar = document.getElementById('progressBar');
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                    return;
                }
                width += Math.random() * 10;
                progressBar.style.width = `${width}%`;
            }, 300);
            return interval;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('imageUpload');
            const previewImage = document.getElementById('preview-image');
            const uploadPrompt = document.getElementById('upload-prompt');
            const processBtn = document.getElementById('processBtn');
            const resultContainer = document.getElementById('result-container');
            const resultImage = document.getElementById('result-image');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const keepSizeCheckbox = document.getElementById('keepSize');
            const sizeControls = document.getElementById('sizeControls');
            const colorOptions = document.querySelectorAll('.color-option');
            const customColorPicker = document.getElementById('customColor');
            const colorHex = document.getElementById('colorHex');

            let selectedColor = '#FFFFFF';
            let uploadedFile = null;
            let progressInterval = null;

            // 初始化颜色显示
            colorHex.textContent = selectedColor;

            // 颜色选择
            colorOptions.forEach(option => {
                option.addEventListener('click', function() {
                    colorOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    selectedColor = this.dataset.color;
                    customColorPicker.value = selectedColor;
                    colorHex.textContent = selectedColor;
                });
            });

            // 自定义颜色选择
            customColorPicker.addEventListener('input', function() {
                colorOptions.forEach(opt => opt.classList.remove('active'));
                selectedColor = this.value;
                colorHex.textContent = selectedColor;
            });

            // 尺寸控制
            keepSizeCheckbox.addEventListener('change', function() {
                sizeControls.style.display = this.checked ? 'none' : 'block';
            });

            // 文件上传处理
            uploadArea.addEventListener('click', () => fileInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');

                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect();
                }
            });

            fileInput.addEventListener('change', handleFileSelect);

            function handleFileSelect() {
                const file = fileInput.files[0];
                if (!file) return;

                if (!file.type.match('image.*')) {
                    showAlert('请选择有效的图片文件！', 'danger');
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    showAlert('文件大小不能超过5MB！', 'danger');
                    return;
                }

                uploadedFile = file;

                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.style.display = 'block';
                    uploadPrompt.style.display = 'none';
                    processBtn.disabled = false;

                    // 如果是第一次上传，显示提示
                    showAlert('图片已准备好，请设置参数后点击生成', 'success');
                };
                reader.readAsDataURL(file);
            }

            // 处理按钮点击
            processBtn.addEventListener('click', async function() {
                if (!uploadedFile) {
                    showAlert('请先上传图片！', 'warning');
                    return;
                }

                const formData = new FormData();
                formData.append('file', uploadedFile);
                formData.append('bg_color', selectedColor);
                formData.append('keep_size', keepSizeCheckbox.checked);
                formData.append('width', document.getElementById('width').value);
                formData.append('height', document.getElementById('height').value);

                // 显示加载状态
                loadingSpinner.style.display = 'block';
                resultContainer.style.display = 'none';
                processBtn.disabled = true;

                // 开始进度条动画
                progressInterval = simulateProgress();

                try {
                    const response = await fetch('/api/process', {
                        method: 'POST',
                        body: formData
                    });

                    // 停止进度条
                    if (progressInterval) clearInterval(progressInterval);
                    document.getElementById('progressBar').style.width = '100%';

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || '服务器返回错误');
                    }

                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error);
                    }

                    // 显示结果
                    resultImage.src = data.result_url + '?t=' + new Date().getTime();
                    downloadBtn.href = data.result_url;
                    downloadBtn.download = `证件照_${new Date().toISOString().slice(0, 10)}.png`;

                    resultContainer.style.display = 'block';
                    loadingSpinner.style.display = 'none';
                    processBtn.disabled = false;

                    // 滚动到结果
                    setTimeout(() => {
                        resultContainer.scrollIntoView({ behavior: 'smooth' });
                    }, 100);

                    showAlert('证件照生成成功！点击下载按钮保存', 'success');

                } catch (error) {
                    console.error('处理错误:', error);
                    showAlert(`处理失败: ${error.message}`, 'danger');
                    loadingSpinner.style.display = 'none';
                    processBtn.disabled = false;

                    // 重置进度条
                    if (progressInterval) clearInterval(progressInterval);
                    document.getElementById('progressBar').style.width = '0%';
                }
            });

            // 重置按钮
            resetBtn.addEventListener('click', function() {
                fileInput.value = '';
                previewImage.src = '';
                previewImage.style.display = 'none';
                uploadPrompt.style.display = 'block';
                processBtn.disabled = true;
                resultContainer.style.display = 'none';
                uploadedFile = null;

                // 重置进度条
                if (progressInterval) clearInterval(progressInterval);
                document.getElementById('progressBar').style.width = '0%';

                // 滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
